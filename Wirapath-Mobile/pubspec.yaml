name: wirapath
description: "Wirapath - Your Path to Success"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.17

  flutter_riverpod: ^3.3.1
  http: ^1.2.0
  url_launcher: ^6.3.0
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
